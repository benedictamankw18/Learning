server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted-looking images and fonts can be cached hard.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Scripts and styles are not fingerprinted. Revalidate so a rebuild (for
    # example a new env.js after changing API_BASE_URL) takes effect without a
    # hard refresh.
    location ~* \.(js|css)$ {
        # expires -1 emits "Cache-Control: no-cache" plus a past Expires header.
        expires -1;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
