services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file: .env.docker
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASS}}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./lms-api
    restart: unless-stopped
    env_file: ./lms-api/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - ./lms-api/uploads:/var/www/html/uploads
      - ./lms-api/logs:/var/www/html/logs

  frontend:
    build:
      context: ./lms-frontend
      args:
        API_BASE_URL: http://localhost:8081
        APP_ENV: production
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - api

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
